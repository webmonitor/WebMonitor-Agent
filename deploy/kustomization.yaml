apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webmonitor
resources:
  - k8s/namespace.yaml
  - k8s/platform.yaml
  - k8s/data.yaml
  - k8s/egress.yaml
  - k8s/app.yaml
  - k8s/network.yaml
# Generated from the same file Compose mounts, so there is one routing config.
configMapGenerator:
  - name: proxy-conf
    files:
      - proxy/nginx.conf
# Create the Secret from a configured copy of k8s/secret.example.yaml first;
# docs/kubernetes.md is the single setup and acceptance procedure.
# The two sidecar images are built only by Compose (compose.yaml), not published;
# push them under these names or repoint them here.
images:
  - name: webmonitor-agent
    newName: ghcr.io/webmonitor/webmonitor-agent
    newTag: latest
  - name: webmonitor-egress
    newTag: local
  - name: webmonitor-minio
    newTag: local
