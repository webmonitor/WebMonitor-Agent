# Squid egress proxy: the only path a collector may use to reach a target.
#
# The image carries deploy/egress/squid.conf, whose `dns_nameservers 127.0.0.11` is
# Docker's embedded resolver. A pod already gets the cluster resolver in
# /etc/resolv.conf, so the init container deletes that line and Squid falls back to
# the system resolver. Copying the file into a ConfigMap would create a second copy
# to keep in sync.
apiVersion: v1
kind: Service
metadata:
  name: egress
spec:
  selector: {app.kubernetes.io/name: webmonitor, app.kubernetes.io/component: egress}
  ports: [{name: proxy, port: 3128, targetPort: 3128}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: webmonitor, app.kubernetes.io/component: egress}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: webmonitor, app.kubernetes.io/component: egress}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: rewrite-dns
          image: webmonitor-egress
          command:
            - sh
            - -ec
            - |
              sed '/^dns_nameservers /d' /etc/squid/squid.conf > /etc/squid-live/squid.conf
              grep -q '^dns_nameservers ' /etc/squid-live/squid.conf && exit 1 || true
              # A pod's RLIMIT_NOFILE is ~1e9, and Squid sizes its descriptor table from
              # that limit: without a ceiling it allocates past any sane memory limit.
              printf 'max_filedescriptors 4096\n' >> /etc/squid-live/squid.conf
          envFrom: [{configMapRef: {name: webmonitor-env}}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: conf, mountPath: /etc/squid-live}
      containers:
        - name: squid
          image: webmonitor-egress
          command: [squid, -N, -f, /etc/squid-live/squid.conf]
          ports: [{containerPort: 3128}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            # `squid -k ...` reads /tmp/squid.pid, which is 1 inside a container and is
            # rejected as malformed; a TCP connect proves the listener is up.
            exec: {command: [bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/3128"]}
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: conf, mountPath: /etc/squid-live}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: conf
          emptyDir: {sizeLimit: 1Mi}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
