# Non-secret settings, mirroring the environment block of compose.yaml. Credentials
# live in the `webmonitor-secrets` Secret (deploy/k8s/secret.example.yaml).
#
# The public nginx proxy is an API sidecar and overwrites forwarding headers with the
# NodePort client address. Only that loopback peer is trusted; remote clients cannot
# reach port 8000 through a Service or NetworkPolicy ingress rule.
apiVersion: v1
kind: ConfigMap
metadata:
  name: webmonitor-env
data:
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: webmonitor
  PGUSER: webmonitor
  # Must match how the NodePort below is published; this is the browser's origin.
  APP_ORIGIN: http://localhost:30080
  DEVELOPMENT_MODE: "true"
  CONTAINER_RUNTIME: "true"
  TRUSTED_PROXY_IP: 127.0.0.1
  SESSION_TTL_HOURS: "168"
  DEFAULT_INTERVAL_SECONDS: "3600"
  DEFAULT_NOTIFICATION_GROUP: ""
  DEFAULT_DELIVERY_CHANNEL: email
  DEFAULT_WEBHOOK_URL: ""
  # Public HTTPS model traffic uses EGRESS_PROXY_URL. Setting the container URL
  # selects a direct internal client and requires the explicit policy overlay in docs.
  OPENAI_BASE_URL: https://api.openai.com/v1
  OPENAI_CONTAINER_BASE_URL: ""
  OPENAI_MODEL: ""
  S3_ENDPOINT_URL: http://s3:9000
  S3_BUCKET: webmonitor-evidence
  # S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY are derived from S3_ROOT_* in app.yaml.
  EGRESS_PROXY_URL: http://egress:3128
  # Direct SMTP supports only a public hostname on TCP 465 (SSL) or 587 (STARTTLS).
  SMTP_HOST: ""
  SMTP_PORT: "465"
  SMTP_USE_SSL: "true"
  SMTP_STARTTLS: "false"
  MAIL_FROM: ""
  TARGET_POLICY: public
  TARGET_ALLOWED_ORIGINS: ""
  MCP_ENABLED: "false"
  MCP_ALLOWED_ORIGINS: ""
  ANALYZE_RUNS_PER_HOUR: "60"
