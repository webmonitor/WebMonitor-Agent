# Default-deny is the baseline. These policies require a CNI that enforces both
# ingress and egress NetworkPolicy; exec probes deliberately need no node ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
# The public proxy and API share one Pod. Remote clients can enter only the proxy's
# port; there is no ingress rule for port 8000 and no API Service. The proxy reaches
# the API over loopback, which is the sole forwarding peer trusted by uvicorn.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: api}}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: web}}}]
      ports: [{protocol: TCP, port: 3000}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: s3}}}]
      ports: [{protocol: TCP, port: 9000}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: egress}}}]
      ports: [{protocol: TCP, port: 3128}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: worker}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: s3}}}]
      ports: [{protocol: TCP, port: 9000}]
    # Targets, webhooks and public model APIs use Squid. An explicitly configured
    # internal model needs a separate, dedicated Pod-selector policy; see docs/kubernetes.md.
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/component: egress}}}]
      ports: [{protocol: TCP, port: 3128}]
    # SMTP is direct, not an HTTP proxy request. Permit only public TCP 465/587;
    # private/loopback/link-local destinations and every other public port stay denied.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.88.99.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/3
        - ipBlock:
            cidr: ::/0
            except:
              - ::/128
              - ::1/128
              - fc00::/7
              - fe80::/10
              - ff00::/8
      ports: [{protocol: TCP, port: 465}, {protocol: TCP, port: 587}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: web}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/component: api}}}]
      ports: [{protocol: TCP, port: 3000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: postgres}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/component: api}}}]
      ports: [{protocol: TCP, port: 5432}]
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/component: worker}}}]
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: s3
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: s3}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/component: api}}}]
      ports: [{protocol: TCP, port: 9000}]
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/component: worker}}}]
      ports: [{protocol: TCP, port: 9000}]
---
# Squid is the only target/webhook/public-model path off the cluster. Squid's own
# destination ACLs recheck resolved addresses; NetworkPolicy independently restricts
# public egress to HTTP(S) ports and excludes non-public destination ranges.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress
spec:
  podSelector: {matchLabels: {app.kubernetes.io/component: egress}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/component: api}}}]
      ports: [{protocol: TCP, port: 3128}]
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/component: worker}}}]
      ports: [{protocol: TCP, port: 3128}]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.88.99.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/3
        - ipBlock:
            cidr: ::/0
            except:
              - ::/128
              - ::1/128
              - fc00::/7
              - fe80::/10
              - ff00::/8
      ports: [{protocol: TCP, port: 80}, {protocol: TCP, port: 443}]
