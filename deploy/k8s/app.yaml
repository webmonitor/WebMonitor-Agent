# One image, three entrypoints. Compose runs `serve` (HTTP plus every background loop)
# and `node /app/web/server.js`; here the loops move to their own Deployment so that
# collection concurrency scales independently of request handling.
#
# Only `worker` may reach a target, and only through the egress proxy. Its pods are
# the only ones that need the browser sandbox: the seccomp profile below is the OCI
# form of deploy/browser-seccomp.json, produced because runc ignores Docker's
# `archMap`/`includes`/`excludes` extensions. Install it at /var/lib/kubelet/seccomp/.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app.kubernetes.io/name: webmonitor, app.kubernetes.io/component: api}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: webmonitor, app.kubernetes.io/component: api}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: webmonitor, app.kubernetes.io/component: api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: webmonitor-agent
          imagePullPolicy: IfNotPresent
          command: [webmonitor, serve]
          envFrom:
            - configMapRef: {name: webmonitor-env}
            - secretRef: {name: webmonitor-secrets}
          env:
            # This pod serves HTTP only; every loop runs in the worker Deployment.
            - {name: WORKERS_ENABLED, value: "false"}
          ports: [{name: http, containerPort: 8000}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            exec: {command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec: {command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec: {command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]}
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: webmonitor, app.kubernetes.io/component: worker}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: webmonitor, app.kubernetes.io/component: worker}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: Localhost, localhostProfile: chromium.json}
      containers:
        - name: worker
          image: webmonitor-agent
          imagePullPolicy: IfNotPresent
          command: [webmonitor, serve]
          envFrom:
            - configMapRef: {name: webmonitor-env}
            - secretRef: {name: webmonitor-secrets}
          env:
            - {name: WORKERS_ENABLED, value: "true"}
          ports: [{name: health, containerPort: 8000}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            exec: {command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]}
            periodSeconds: 2
            failureThreshold: 60
          # /ready reports 503 once the background TaskGroup has stopped, so this is the
          # only probe that notices a dead worker. A brief database outage also fails it;
          # restarting is safe because claims are leased and unfinished work is requeued.
          livenessProbe:
            exec: {command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]}
            periodSeconds: 15
            failureThreshold: 4
          resources:
            # Chromium needs shared memory; without it the browser exits on render.
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app.kubernetes.io/name: webmonitor, app.kubernetes.io/component: web}
  ports: [{name: http, port: 3000, targetPort: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: webmonitor, app.kubernetes.io/component: web}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: webmonitor, app.kubernetes.io/component: web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: webmonitor-agent
          imagePullPolicy: IfNotPresent
          command: [node, /app/web/server.js]
          env:
            # The kubelet injects HOSTNAME as the pod name. Next.js binds to it and
            # would fail, so the Dockerfile value is restated here.
            - {name: HOSTNAME, value: "0.0.0.0"}
          ports: [{name: http, containerPort: 3000}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            exec: {command: [node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec: {command: [node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: next-cache, mountPath: /app/web/.next/cache}
            - {name: tmp, mountPath: /tmp}
      volumes:
        # Next.js writes image and fetch cache here; the root filesystem is read-only.
        - name: next-cache
          emptyDir: {sizeLimit: 128Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
# Same routing layer as Compose: one origin for the browser, /api/v1 to the API and
# everything else to Next.js. The ConfigMap is generated from deploy/proxy/nginx.conf.
apiVersion: v1
kind: Service
metadata:
  name: proxy
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: webmonitor, app.kubernetes.io/component: proxy}
  ports: [{name: http, port: 8080, targetPort: 8080, nodePort: 30080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: webmonitor, app.kubernetes.io/component: proxy}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: webmonitor, app.kubernetes.io/component: proxy}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: proxy
          image: nginx:1.28-alpine
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec: {command: [wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/v1/health/ready]}
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: conf
          configMap: {name: proxy-conf}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
