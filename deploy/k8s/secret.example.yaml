# Apply before the rest of the manifests. Values are the credentials Compose keeps in
# .env; nothing here is valid as-is.
#
#   kubectl create secret generic webmonitor-secrets \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=SECRET_KEY=... \
#     --from-literal=S3_ROOT_PASSWORD=... \
#     --from-literal=S3_SECRET_ACCESS_KEY=... \
#     -n webmonitor
#
# S3_ROOT_PASSWORD and S3_SECRET_ACCESS_KEY must carry the same value: the first is the
# MinIO root credential, the second is what the application signs uploads with.
apiVersion: v1
kind: Secret
metadata:
  name: webmonitor-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-with-a-local-postgres-password
  SECRET_KEY: replace-with-at-least-32-characters
  S3_ROOT_USER: webmonitor-admin
  S3_ROOT_PASSWORD: replace-with-the-minio-root-password
  S3_SECRET_ACCESS_KEY: replace-with-the-minio-root-password
  OPENAI_API_KEY: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: ""
