# The only Secret entry point. Copy this file outside the checkout, replace every
# placeholder, then follow docs/kubernetes.md. Never apply the example unchanged or
# commit the configured copy. There is no secret.example.env.
apiVersion: v1
kind: Secret
metadata:
  name: webmonitor-secrets
  namespace: webmonitor
type: Opaque
stringData:
  POSTGRES_PASSWORD: "replace-with-a-local-postgres-secret"
  SECRET_KEY: "replace-with-a-random-signing-key"
  # app.yaml derives both application S3 credentials from these same two keys.
  S3_ROOT_USER: "replace-with-the-minio-root-user"
  S3_ROOT_PASSWORD: "replace-with-the-minio-root-secret"
  OPENAI_API_KEY: "replace-with-the-model-api-key"
  # Empty credentials require empty SMTP_HOST and MAIL_FROM in the ConfigMap.
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  # Leave both empty to skip initial administrator creation and use admin-create later.
  ADMIN_EMAIL: ""
  ADMIN_PASSWORD: ""
